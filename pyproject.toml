[project]
name = "icp-enrichment"
version = "0.1.0"
description = "ICP-fit enrichment pipeline: domain -> structured account judgment"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "lxml_html_clean>=0.1",  # older trafilatura/lxml split this out
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
icp = "icp.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
